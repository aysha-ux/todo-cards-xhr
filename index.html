<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo XHR</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div class="container my-5">
        <h1 class="text-primary text-center">ALL users todo List</h1>
        <div id="result" class="row ">
            <div class="col-3-lg">

            </div>
        </div>
    </div>
</body>
<script>
    const xhr=new XMLHttpRequest()
    xhr.open("GET","https://jsonplaceholder.typicode.com/todos")
    xhr.send()
    xhr.onreadystatechange=()=>{
        if(xhr.readyState==4&&xhr.status==200){
            const alltodos=JSON.parse(xhr.responseText)
            console.log(alltodos);
            alltodos.forEach(todo=>{

                result.innerHTML +=`
                <div class="card mx-2 my-2 shadow" style="width: 18rem;">
  <div class="card-body">
    <h5 class="card-title">${todo.userId}</h5>
    <h6 class="card-subtitle mb-2 text-body-secondary">${todo.id}</h6>
    <p class="card-text">${todo.title}</p>
   <p class="card-text" >${todo.completed?'<span class="text-success">Completed</span>':'<span class="text-danger">Pending</span>'}</p>
  </div>
</div>`
            })
        }
    }
</script>

</html>
